# При пуше тега вида v1.0.0 прогоняет тесты, собирает бинарники под все системы
# и публикует их в GitHub Releases вместе с контрольными суммами.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # нужно, чтобы создать релиз

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # В Ubuntu 23.10+ AppArmor запрещает user namespaces, и Chrome не может включить песочницу —
      # тест рендера тогда пропускается. Разрешаем их, чтобы тест реально запускал Chrome.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go test -v ./...
      - run: ./scripts/build.sh
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
