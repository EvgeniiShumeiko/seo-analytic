# При пуше тега вида v1.0.0 прогоняет тесты, собирает бинарники под все системы
# и публикует их в GitHub Releases вместе с контрольными суммами.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # нужно, чтобы создать релиз

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: ./scripts/build.sh
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
